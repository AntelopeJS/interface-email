<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="title desc">
  <title id="title">From message to provider response</title>
  <desc id="desc">Send, SendTemplate, and SendBatch lead to a configured provider. Inspect acceptance, status, and per-message errors. Acceptance is not proof of inbox delivery.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#627d98"/></marker></defs>
  <rect width="800" height="350" rx="16" fill="#f4f7fb"/>
  <g font-family="system-ui, sans-serif" fill="#17324d">
    <text x="28" y="38" font-size="22" font-weight="700">Choose content. Inspect the outcome.</text>
    <text x="28" y="64" font-size="14">Email contract · configured provider required</text>
    <g fill="#e2edf8" stroke="#b0c9e0"><rect x="28" y="94" width="196" height="46" rx="8"/><rect x="28" y="152" width="196" height="46" rx="8"/><rect x="28" y="210" width="196" height="46" rx="8"/></g>
    <g font-size="16" font-weight="600"><text x="44" y="123">Send · one email</text><text x="44" y="181">SendTemplate</text><text x="44" y="239">SendBatch</text></g>
    <path d="M224 117H255V233H224M224 175H255" fill="none" stroke="#627d98" stroke-width="2"/>
    <path d="M255 175H292" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="302" y="127" width="196" height="96" rx="10" fill="#17324d"/>
    <text x="320" y="164" fill="#fff" font-size="18" font-weight="700">Email provider</text><text x="320" y="192" fill="#d5e5f3" font-size="14">Capabilities + limits</text>
    <path d="M498 175H546" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="556" y="104" width="216" height="144" rx="10" fill="#e2f3ec" stroke="#91c7ae"/>
    <text x="574" y="136" font-size="18" font-weight="700">Read the response</text><text x="574" y="166" font-size="16">success + status</text><text x="574" y="193" font-size="15">Optional ID and error</text><text x="574" y="220" font-size="15">Batch: inspect each result</text>
    <rect x="28" y="282" width="744" height="42" rx="8" fill="#fff0cf"/><text x="44" y="309" font-size="16">Accepted ≠ delivered. Retries need an application duplicate-send policy.</text>
  </g>
</svg>
